[package]
name = "anansi-core"
version.workspace = true
edition.workspace = true

[features]
# Explicit platform integration: requires system D-Bus development/runtime setup.
# Without this feature Linux native-store operations fail closed, never use mock.
linux-secret-service = ["keyring/sync-secret-service", "keyring/crypto-rust"]

[dependencies]
anansi-providers = { path = "../providers" }
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
rusqlite = { version = "=0.40.2", features = ["bundled", "backup"] }
getrandom = "=0.4.3"
sha2 = "=0.10.9"
chrono = { version = "=0.4.45", default-features = false, features = ["std", "now"] }
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc", "zeroize"] }
# Bounded URL fetching: URL parsing, rustls TLS (ring +
# Mozilla roots, mirroring anansi-providers). No danger APIs.
url = "=2.5.8"
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "=1.15.1"
webpki-roots = "=1.0.10"
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc", "zeroize"] }
zeroize = { version = "=1.9.1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }
windows-sys = { version = "=0.45.0", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Memory", "Win32_System_SystemServices", "Win32_System_Threading"] }
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native"] }
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", default-features = false }
[dev-dependencies]
tempfile = "=3.27.0"
