[package]
name = "anansi-providers"
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
description = "ANANSI M5 AI Matrix provider-integration package: adapters, routing, quotas, Zero-Cost Lock. Developed standalone on the M5 branch; registered in the root workspace by the M5 integration commit (see docs/handoffs/M5-to-integrator.md)."

[features]
# Explicit platform integration, mirroring anansi-core: without this
# feature Linux native-store operations fail closed, never mock.
linux-secret-service = ["keyring/sync-secret-service", "keyring/crypto-rust"]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154" }
schemars.workspace = true
# TLS: rustls with the ring crypto provider and Mozilla root set
# (webpki-roots). Certificate and hostname validation are rustls
# defaults and are never disabled in this crate (no danger APIs).
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "=1.15.1"
webpki-roots = "=1.0.10"

[target.'cfg(windows)'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", default-features = false }

[dev-dependencies]
# Synthetic servers are std TcpListeners; the HTTPS harness terminates
# TLS with rustls server-side and generates test-only certificates
# with rcgen. Nothing here ships in the library.
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "=2.2.0"
rcgen = "=0.13.2"
time = "=0.3.47"
