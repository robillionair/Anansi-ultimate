name: Foundation CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  foundation:
    name: Foundation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.25.0
          run_install: false
      - name: Verify package manager and frozen resolution
        run: |
          node --version
          pnpm --version
          pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm check
      - run: pnpm test
      - name: Install pinned Rust for shared core and API
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - run: node scripts/cargo.mjs fmt --all --check
      - run: node scripts/cargo.mjs test --locked
      - run: node scripts/cargo.mjs clippy --all-targets --locked -- -D warnings
      - run: pnpm contracts:check
      - run: pnpm typecheck
      - run: pnpm test:ui
      - run: pnpm build:web
      - run: node scripts/cargo.mjs build --locked -p anansi-api
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Check committed whitespace and unchanged lockfile
        run: |
          git show --format= --check HEAD
          git diff --exit-code -- pnpm-lock.yaml
  native-toolchain:
    name: Windows native toolchain smoke
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install exact Rust MSVC toolchain
        shell: pwsh
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Compile, link and execute the synthetic MSVC smoke fixture
        shell: pwsh
        run: pwsh -NoProfile -File scripts/verify-native.ps1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.25.0
          run_install: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build:web
      - run: node scripts/cargo.mjs test --workspace --locked
      - run: node scripts/cargo.mjs clippy --workspace --all-targets --locked -- -D warnings
      - name: Build debug-only native UI test configuration
        shell: pwsh
        run: |
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = [Security.Principal.WindowsPrincipal]::new($identity)
          Write-Output ('Native test host elevated: ' + $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator))
          node scripts/build-desktop-test.mjs
      - run: node scripts/verify-desktop.mjs --configured-cdp
      - run: node scripts/cargo.mjs build --locked -p anansi-api
      - run: pnpm exec playwright install --with-deps chromium
      - run: node scripts/verify-workspace.mjs --configured-cdp
      - run: node scripts/verify-memory.mjs --configured-cdp
      - run: node scripts/verify-entities.mjs --configured-cdp
      - run: node scripts/verify-export.mjs --configured-cdp
      - run: node scripts/verify-backup.mjs --configured-cdp
      - name: Build unsigned development NSIS release installer
        run: pnpm build:installer
      - name: Verify release package installation and uninstall (UI covered separately)
        run: |
          pwsh -NoProfile -File tests/installer-preflight.Tests.ps1
          pwsh -NoProfile -File scripts/verify-installer.ps1 -SkipUi
      - name: Preserve release installer and checksum evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: anansi-windows-development-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/nsis/SHA256SUMS
            target/release/bundle/nsis/packaging.json
            target/release/bundle/nsis/installer-verification.json
